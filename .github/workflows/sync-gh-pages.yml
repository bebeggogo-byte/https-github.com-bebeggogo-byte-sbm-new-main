name: Sync main → gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build publish tree
        run: |
          rm -rf _publish
          mkdir _publish
          # 사이트 전체를 복사한다 (word/·programs/ 등 하위 페이지 포함).
          # VCS/워크플로/발행 임시 디렉터리만 제외.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_publish' \
            ./ _publish/
          touch _publish/.nojekyll
          echo "Published tree (top level):"; ls -la _publish
          echo "word/ present?"; ls -la _publish/word 2>/dev/null || echo "MISSING word/"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          publish_branch: gh-pages
          cname: nedabah.org
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: sync from main ${{ github.sha }}'
