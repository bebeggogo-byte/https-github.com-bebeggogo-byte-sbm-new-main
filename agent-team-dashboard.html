<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 AI 직원실 · 에이전트 팀 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#d9c3a0;--wall:#e9ddca;--ink:#2b2622;--panel:#fff;--line:#e4dccb;
  --accent:#5b8def;--green:#3aa564;--amber:#e0a040;--bubble:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DotGothic16','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:#bcae93;color:var(--ink);-webkit-font-smoothing:none;image-rendering:pixelated;
}
.app{display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr;height:100vh}
/* 상단 */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 18px;background:#15110d;color:#fff;flex-wrap:wrap}
.topbar .badge{font-size:21px;letter-spacing:1px;background:#000;padding:8px 18px;border-radius:6px;border:2px solid #3a3024}
.topbar .badge b{color:#ffd66b}
.topbar .grow{flex:1}
.topbar button{font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;border:none;padding:9px 15px;border-radius:6px;font-size:13px;box-shadow:0 3px 0 #3a63b8}
.topbar button:active{transform:translateY(2px);box-shadow:0 1px 0 #3a63b8}
.topbar button.ghost{background:#2a2218;box-shadow:0 3px 0 #000}
/* 사무실 */
.office{position:relative;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(0,0,0,.04) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(0,0,0,.04) 39px 40px),
  linear-gradient(var(--wall) 0 92px,var(--floor) 92px 100%)}
.zone-label{position:absolute;font-size:13px;color:#8a7a5c;letter-spacing:2px;transform:translateX(-50%)}
.agent{position:absolute;width:104px;transform:translateX(-50%);text-align:center;cursor:pointer;transition:filter .15s,transform .15s}
.agent:hover{filter:brightness(1.05);transform:translateX(-50%) scale(1.05)}
.agent .char{width:46px;height:54px;margin:0 auto;position:relative;animation:bob 1.6s ease-in-out infinite}
.agent.idle .char{animation-duration:3.2s;opacity:.92}
@keyframes bob{50%{transform:translateY(-3px)}}
.char .head{position:absolute;left:13px;top:0;width:20px;height:18px;border-radius:4px;background:#f1c9a5}
.char .body{position:absolute;left:9px;top:18px;width:28px;height:26px;border-radius:5px 5px 3px 3px}
.char .arm{position:absolute;top:24px;width:6px;height:14px;border-radius:3px}
.char .arm.l{left:6px;animation:type .5s steps(2) infinite}
.char .arm.r{right:6px;animation:type .5s steps(2) infinite .25s}
.agent.idle .arm{animation:none}
@keyframes type{50%{transform:translateY(3px)}}
.char .face{position:absolute;left:18px;top:7px;width:3px;height:3px;background:#2b2622;box-shadow:7px 0 #2b2622}
.desk{width:90px;height:18px;margin:2px auto 0;background:linear-gradient(#7a5a3a,#5e4128);border-radius:3px;box-shadow:0 3px 0 #3d2a17;position:relative}
.desk::before{content:"";position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:26px;height:16px;background:#23303f;border:2px solid #11171f;border-radius:2px;box-shadow:inset 0 0 0 2px #2f6df0}
.agent.idle .desk::before{box-shadow:inset 0 0 0 2px #44505f}
.name{margin-top:5px;font-size:12px;background:#fff;border:2px solid #d8cdb6;border-radius:5px;padding:2px 4px;line-height:1.25}
.name small{display:block;color:#9a8a6a;font-size:10px}
.name .tag{display:inline-block;font-size:9px;color:#fff;background:#9a8a6a;border-radius:3px;padding:0 4px;margin-top:2px}
.name .tag.api{background:var(--green)}
.bubble{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:var(--bubble);border:2px solid #cdbf9f;border-radius:8px;padding:3px 7px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--bubble)}
.bubble.done{color:var(--green)}.bubble.work{color:var(--accent)}.bubble.idle{color:#9a8a6a}
.spark{position:absolute;left:-13px;top:-9px;font-size:13px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 패널 */
.panel{background:var(--panel);border-left:3px solid #cbbd9e;padding:16px;overflow:auto;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.panel h2{font-size:14px;letter-spacing:1px;color:#7a6c50;margin-bottom:10px;font-family:'DotGothic16',sans-serif}
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#f7f3ea;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat .num{font-size:24px;font-family:'Press Start 2P',monospace}
.stat .lbl{font-size:11px;color:#9a8a6a;margin-top:6px}
.tok{background:#1d1812;color:#cfe;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.9}
.tok span{color:#ffd66b}.tok .cost{color:#7CFFB2}
.section{margin-bottom:14px}
.section h3{font-size:12px;color:#7a6c50;margin-bottom:7px;letter-spacing:1px}
.task{display:flex;gap:8px;align-items:flex-start;background:#f7f3ea;border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:6px;font-size:12px}
.task .dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex:none;background:var(--accent);box-shadow:0 0 0 3px rgba(91,141,239,.2)}
.task .meta{color:#9a8a6a;font-size:11px;margin-top:2px}
.done-item{display:flex;gap:7px;align-items:center;font-size:12px;color:#5b6b55;padding:3px 0}
.done-item .ck{color:var(--green)}
.foot{font-size:10px;color:#b3a890;margin-top:8px;text-align:center;font-family:'DotGothic16',sans-serif}
/* 직무카드 모달 */
.modal{position:fixed;inset:0;background:rgba(20,15,10,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.card{width:340px;max-width:92vw;background:#fff;border:3px solid #15110d;border-radius:14px;overflow:hidden;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.card .hd{padding:16px;color:#fff;display:flex;gap:12px;align-items:center}
.card .hd .av{width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px}
.card .hd h3{font-size:18px}.card .hd p{font-size:12px;opacity:.9}
.card .bd{padding:16px}
.card .bd .label{font-size:11px;color:#9a8a6a;margin:10px 0 5px;letter-spacing:1px}
.card .chip{display:inline-block;font-size:12px;background:#f1ece1;border:1px solid var(--line);border-radius:14px;padding:3px 9px;margin:0 4px 5px 0}
.card .use{font-size:13px;line-height:1.6;color:#3a342c;background:#f7f3ea;border-radius:8px;padding:10px}
.card .mode{font-size:11px;color:#fff;border-radius:4px;padding:2px 7px}
.card .mode.api{background:var(--green)}.card .mode.manual{background:#9a8a6a}
.card .x{margin:0 16px 16px;width:calc(100% - 32px);padding:10px;border:none;border-radius:8px;background:#15110d;color:#fff;font-size:14px;cursor:pointer;font-family:'DotGothic16',sans-serif}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="badge">직원수 : <b id="empCount">0</b>명 / 목표수 : <b>10</b>명</div>
    <div class="grow"></div>
    <button id="hireBtn">＋ 직원 채용</button>
    <button class="ghost" id="assignBtn">태스크 배정</button>
  </header>

  <main class="office" id="office">
    <div class="zone-label" style="left:24%;top:72px">PM 데스크</div>
    <div class="zone-label" style="left:52%;top:72px">문서·기획실</div>
    <div class="zone-label" style="left:80%;top:72px">개발실</div>
    <div class="zone-label" style="left:16%;top:150px">마케팅실</div>
  </main>

  <aside class="panel">
    <h2>팀 현황</h2>
    <div class="stat-row">
      <div class="stat"><div class="num" id="totalNum">0</div><div class="lbl">총 인원</div></div>
      <div class="stat"><div class="num" id="busyNum">0</div><div class="lbl">작업중</div></div>
      <div class="stat"><div class="num" id="idleNum">0</div><div class="lbl">대기</div></div>
    </div>
    <div class="tok">
      토큰 입력 <span id="tin">0</span><br>
      토큰 출력 <span id="tout">0</span><br>
      예상 비용 <span class="cost" id="cost">$0.00</span>
    </div>
    <div class="section"><h3>진행중인 태스크</h3><div id="activeTasks"></div></div>
    <div class="section"><h3>최근 완료</h3><div id="doneTasks"></div></div>
    <p class="foot">⌁ 클로드로 만든 내 AI 직원실 · 클릭하면 직무카드</p>
  </aside>
</div>

<!-- 직무카드 -->
<div class="modal" id="modal">
  <div class="card">
    <div class="hd" id="cardHd">
      <div class="av" id="cardAv">🤖</div>
      <div><h3 id="cardName"></h3><p id="cardRole"></p></div>
    </div>
    <div class="bd">
      <div><span class="mode" id="cardMode"></span></div>
      <div class="label">잘하는 일</div>
      <div id="cardBest"></div>
      <div class="label">언제 부르나</div>
      <div class="use" id="cardUse"></div>
    </div>
    <button class="x" id="cardClose">닫기</button>
  </div>
</div>

<script src="agents.js"></script>
<script>
const GOAL = 10;
const rand = a => a[Math.floor(Math.random()*a.length)];
let agents = TEAM.map(a=>({...a}));
let bench  = BENCH.map(a=>({...a}));
let doneTasks = ["랜딩페이지 카피 초안","체험단 모집 공지","블로그 포스팅 5건 발행"];
let tokIn=0, tokOut=0;
const office = document.getElementById('office');

const ZONE_SEATS = {
  PM:[[24,32]],
  문서:[[46,34],[58,52]],
  개발:[[80,32],[88,54]],
  마케팅:[[14,52],[30,70],[46,72],[62,72],[16,88],[34,88],[58,88],[78,72]]
};
const usedSeat = {};
function seatFor(zone,i){
  const z = ZONE_SEATS[zone]||ZONE_SEATS.마케팅;
  usedSeat[zone]=(usedSeat[zone]||0);
  const s = z[usedSeat[zone] % z.length];
  usedSeat[zone]++;
  return s;
}
function charHTML(c){return `<div class="char"><div class="head"></div><div class="face"></div>
  <div class="body" style="background:${c}"></div>
  <div class="arm l" style="background:${c}"></div><div class="arm r" style="background:${c}"></div></div>`}
function bubbleFor(a){
  if(a.status==="작업중"&&a.task) return `<div class="bubble work"><span class="spark">✦</span>${a.task}</div>`;
  if(a.status==="완료") return `<div class="bubble done">완료 ✓</div>`;
  return `<div class="bubble idle">대기</div>`;
}
function renderOffice(){
  office.querySelectorAll('.agent').forEach(e=>e.remove());
  for(const k in usedSeat) usedSeat[k]=0;
  agents.forEach((a,i)=>{
    const [x,y]=seatFor(a.zone,i);
    const el=document.createElement('div');
    el.className='agent'+(a.status==="대기"?' idle':'');
    el.style.left=x+'%'; el.style.top=y+'%';
    const tag = a.mode==="api"?'<span class="tag api">자동연동</span>':'<span class="tag">수동</span>';
    el.innerHTML=bubbleFor(a)+charHTML(a.color)+
      `<div class="desk"></div><div class="name">${a.name}<small>${a.tool} · ${a.role}</small>${tag}</div>`;
    el.onclick=()=>openCard(a);
    office.appendChild(el);
  });
}
function renderPanel(){
  document.getElementById('empCount').textContent=agents.length;
  document.getElementById('totalNum').textContent=agents.length;
  const busy=agents.filter(a=>a.status==="작업중").length;
  document.getElementById('busyNum').textContent=busy;
  document.getElementById('idleNum').textContent=agents.filter(a=>a.status==="대기").length;
  document.getElementById('activeTasks').innerHTML=agents.filter(a=>a.task).map(a=>`
    <div class="task"><span class="dot"></span><div><div>${a.task}</div>
    <div class="meta">진행중 · ${a.name}</div></div></div>`).join('')||'<div class="meta" style="color:#9a8a6a;font-size:12px">진행중 없음 — 태스크 배정을 눌러보세요</div>';
  document.getElementById('doneTasks').innerHTML=doneTasks.slice(0,6).map(d=>`
    <div class="done-item"><span class="ck">✔</span>${d}</div>`).join('');
}
/* 직무카드 */
function openCard(a){
  document.getElementById('cardHd').style.background=a.color;
  document.getElementById('cardAv').textContent=a.mode==="api"?"⚡":"🛠";
  document.getElementById('cardName').textContent=a.name;
  document.getElementById('cardRole').textContent=`${a.tool} · ${a.role}`;
  const m=document.getElementById('cardMode');
  m.className='mode '+a.mode; m.textContent=a.mode==="api"?"자동연동 가능 (API)":"수동 도구";
  document.getElementById('cardBest').innerHTML=a.best.map(b=>`<span class="chip">${b}</span>`).join('');
  document.getElementById('cardUse').textContent=a.use;
  document.getElementById('modal').classList.add('on');
}
document.getElementById('cardClose').onclick=()=>document.getElementById('modal').classList.remove('on');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on')};
/* 토큰 카운터 (작업중 직원만큼 증가) */
const fmt=n=>n.toLocaleString('en-US');
setInterval(()=>{
  const busy=agents.filter(a=>a.status==="작업중").length;
  tokIn+=busy*Math.floor(20+Math.random()*120);
  tokOut+=busy*Math.floor(40+Math.random()*260);
  document.getElementById('tin').textContent=fmt(tokIn);
  document.getElementById('tout').textContent=fmt(tokOut);
  document.getElementById('cost').textContent='$'+(tokIn/1e6*3+tokOut/1e6*15).toFixed(2);
},700);
/* 버튼 */
document.getElementById('hireBtn').onclick=()=>{
  if(!bench.length||agents.length>=GOAL){alert(agents.length>=GOAL?"목표 인원 도달!":"대기 명단이 비었어요. agents.js의 BENCH에 추가하세요.");return;}
  agents.push(bench.shift()); renderOffice(); renderPanel();
};
const TASK_POOL=["인스타 릴스 3건 기획","상세페이지 카피 작성","A/B 테스트 결과 분석","CS 응대 매크로 정리","결제 플로우 점검","제안서 초안 작성"];
document.getElementById('assignBtn').onclick=()=>{
  const free=agents.find(a=>a.status==="대기");
  if(!free){alert("대기중인 직원이 없어요. 채용하거나 기다려주세요.");return;}
  free.task=rand(TASK_POOL); free.status="작업중";
  renderOffice(); renderPanel();
};
/* 살아있는 느낌 — 가끔 완료 처리 */
setInterval(()=>{
  const w=agents.filter(a=>a.status==="작업중"&&a.task);
  if(w.length&&Math.random()<0.5){
    const a=rand(w); doneTasks.unshift(a.task); doneTasks=doneTasks.slice(0,6);
    a.task=null; a.status="완료";
    setTimeout(()=>{a.status="대기";renderOffice();renderPanel();},4000);
    renderOffice(); renderPanel();
  }
},3000);
renderOffice(); renderPanel();
</script>
</body>
</html>
